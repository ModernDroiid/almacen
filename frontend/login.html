<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Occidente — Iniciar sesión</title>
    <link rel="icon" type="image/png" href="img/logoocci.png">
    <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body class="pagina-login">

    <div class="login-panel-izq">
        <img src="img/occidentelogin.png?v=2" class="login-logo-panel" alt="Occidente Seguridad Privada">

        <div class="login-panel-contenido">
            <p class="login-titulo">Iniciar sesión</p>

            <div class="error-msg" id="error-msg">
                <span id="error-msg-texto">Email o contraseña incorrectos</span>
            </div>

            <form onsubmit="iniciarSesion(event)">
                <div class="campo">
                    <label>Email</label>
                    <input type="text" id="login-email" required
                           placeholder="usuario@occidente.com" autocomplete="email">
                </div>
                <div class="campo">
                    <label>Contraseña</label>
                    <div class="campo-password-wrapper">
                        <input type="password" id="login-password" required
                               placeholder="••••••••" autocomplete="current-password">
                        <button type="button" class="btn-toggle-pass" id="btn-toggle-pass"
                                onclick="togglePassword()" title="Mostrar/ocultar contraseña">
                            <svg id="icono-ojo" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-login" id="btn-login">
                    <span class="spinner" id="btn-login-spinner"></span>
                    <span id="btn-login-texto">Iniciar sesión</span>
                </button>
            </form>
        </div>

        <div class="login-footer-panel">
            Occidente Seguridad Privada © 2026
        </div>
    </div>

    <div class="login-panel-der">
        <div class="login-ilustracion">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2 4 5v6c0 5.2 3.4 9.9 8 11 4.6-1.1 8-5.8 8-11V5l-8-3z"
                      stroke="white" stroke-width="1.1" stroke-linejoin="round"/>
                <path d="M8.5 12.2l2.3 2.3 4.7-4.9"
                      stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <h2>Control total de tu almacén</h2>
            <p>Entradas, salidas, traslados y devoluciones de todas tus sedes, en un solo lugar.</p>
        </div>
    </div>

<script>
    const API = '/api';

    if (localStorage.getItem('token')) {
        window.location.href = 'index.html';
    }

    async function iniciarSesion(event) {
        event.preventDefault();

        const email    = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const btn      = document.getElementById('btn-login');
        const btnTexto = document.getElementById('btn-login-texto');
        const spinner  = document.getElementById('btn-login-spinner');
        const errorMsg = document.getElementById('error-msg');
        const errorTxt = document.getElementById('error-msg-texto');

        btnTexto.textContent = 'Iniciando...';
        spinner.classList.add('visible');
        btn.disabled = true;
        errorMsg.classList.remove('visible');

        try {
            const res = await fetch(`${API}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (res.ok) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('usuario', JSON.stringify({
                    nombre:      data.nombre,
                    rol:         data.rol,
                    sede_id:     data.sede_id,
                    sede_nombre: data.sede_nombre,
                    ciudad:      data.ciudad
                }));
                window.location.href = 'index.html';
            } else {
                errorTxt.textContent = data.error || 'Error al iniciar sesion';
                errorMsg.classList.add('visible');
                btnTexto.textContent = 'Iniciar sesión';
                spinner.classList.remove('visible');
                btn.disabled = false;
            }
        } catch (e) {
            errorTxt.textContent = 'No se pudo conectar al servidor';
            errorMsg.classList.add('visible');
            btnTexto.textContent = 'Iniciar sesión';
            spinner.classList.remove('visible');
            btn.disabled = false;
        }
    }

    function togglePassword() {
        const input  = document.getElementById('login-password');
        const icono  = document.getElementById('icono-ojo');

        if (input.type === 'password') {
            input.type = 'text';
            // Ojo tachado (contraseña visible), como en Gmail/Facebook
            icono.innerHTML =
                '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.5 18.5 0 0 1 5.06-5.94"></path>' +
                '<path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"></path>' +
                '<path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>' +
                '<line x1="1" y1="1" x2="23" y2="23"></line>';
        } else {
            input.type = 'password';
            // Ojo abierto (contraseña oculta)
            icono.innerHTML =
                '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>' +
                '<circle cx="12" cy="12" r="3"></circle>';
        }
    }
</script>
</body>
</html>
